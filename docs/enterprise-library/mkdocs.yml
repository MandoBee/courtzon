# CourtZon Enterprise Knowledge Platform — MkDocs Configuration
site_name: "CourtZon Enterprise Knowledge Platform"
site_description: "Official documentation for CourtZon Enterprise Sports ERP"
site_author: "CourtZon Engineering"
repo_url: "https://github.com/MandoBee/courtzon"
edit_uri: "edit/master/docs/enterprise-library/"
copyright: "Copyright &copy; 2026 CourtZon"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  logo: assets/courtzon-icon.png
  favicon: assets/favicon.ico

plugins:
  - search
  - tags
  - glightbox
  - awesome-pages
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MandoBee/courtzon
  tags:
    - booking
    - payment
    - wallet
    - marketplace
    - academy
    - tournament
    - league
    - crm
    - hr
    - operations
    - security
    - architecture
    - development
    - adr
    - reference
    - guide
    - tutorial
    - troubleshooting

