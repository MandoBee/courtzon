    <title>CourtZon - Sports Facility Booking</title>
    <style>
      #cz-initial-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0A0A0F;
        transition: opacity 0.3s ease;
      }
      #cz-initial-splash.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #cz-initial-splash .cz-splash-logo {
        width: 96px;
        height: 96px;
        color: #059669;
      }
      #cz-initial-splash .cz-splash-dots {
        position: absolute;
        bottom: 3rem;
        display: flex;
        gap: 0.5rem;
      }
      #cz-initial-splash .cz-splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(5,150,105,.5);
        animation: cz-splash-dot 1.2s ease-in-out infinite;
      }
      #cz-initial-splash .cz-splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      #cz-initial-splash .cz-splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes cz-splash-dot {
        0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
        40% { opacity: 1; transform: scale(1); }
      }
      #cz-initial-splash .cz-splash-reload {
        display: none;
        align-items: center;
        gap: 0.75rem;
        margin-top: 2.5rem;
        color: rgba(255,255,255,.75);
        font-size: .875rem;
      }
      .cz-splash-spinner {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.25);
        border-top-color: #fff;
        animation: cz-splash-spin .8s linear infinite;
      }
      @keyframes cz-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="cz-initial-splash">
      <svg class="cz-splash-logo" viewBox="0 0 132 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9V3L4 13h6v6l8-10h-6z"/>
      </svg>
      <div class="cz-splash-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="cz-splash-reload">
        <span class="cz-splash-spinner"></span>
        <span>Loading latest version...</span>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem('cz_pending_reload') === '1') {
            var dots = document.querySelector('#cz-initial-splash .cz-splash-dots');
            var reload = document.querySelector('#cz-initial-splash .cz-splash-reload');
            if (dots) dots.style.display = 'none';
            if (reload) reload.style.display = 'flex';
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
