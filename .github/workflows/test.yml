name: Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: courtzon_v2_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -ptest_root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-mysql-client
      - name: Create fresh schema (baseline)
        # Mirrors the Docker entrypoint / integration harness: the baseline is the
        # full final schema; its appended section emits a non-fatal "table already
        # exists" warning, so --force is used and the exit status is tolerated.
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -ptest_root -e "DROP DATABASE IF EXISTS courtzon_v2_test; CREATE DATABASE courtzon_v2_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -h 127.0.0.1 -P 3306 -uroot -ptest_root --force courtzon_v2_test -e "source ../database/baseline/001_courtzon_v3.sql" || echo "baseline residual warnings tolerated"
      - name: Seed database (canonical seed mechanism)
        run: node scripts/seed.js
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: courtzon_v2_test
          DB_USER: root
          DB_PASSWORD: test_root
          NODE_ENV: test
      - name: Run unit tests
        run: npm run test:unit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: courtzon_v2_test
          DB_USER: root
          DB_PASSWORD: test_root
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          NODE_ENV: test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test
