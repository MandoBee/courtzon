name: CourtZon CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.workspace }}
      - run: npm run build --if-present
        working-directory: ${{ matrix.workspace }}

  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # CI-only .env for the disposable test stack. `docker compose` aborts
      # because backend declares `env_file: [.env]`, which is gitignored and
      # absent on a fresh runner. Values are non-production test placeholders
      # derived from docker-compose.yml + backend/src/config/env.ts (production
      # fail-fast): MYSQL_ROOT_PASSWORD must equal DB_PASSWORD, DB_USER is root
      # (database/Dockerfile creates no app_user), and PAYMENT_GATEWAY_PROVIDER
      # must not be "mock" in production. REDIS_PASSWORD stays empty, matching
      # the compose ${REDIS_PASSWORD:+...} command/healthcheck. Never committed.
      - name: Create CI-only .env
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_test_root_pw
          DB_USER=root
          DB_PASSWORD=ci_test_root_pw
          DB_NAME=courtzon_v3
          SESSION_SECRET=ci_only_test_session_secret_at_least_32_chars_long
          PAYMENT_GATEWAY_PROVIDER=paymob
          REDIS_PASSWORD=
          EOF
      - run: docker compose build backend frontend
      - run: docker compose up -d
      - run: sleep 10
      - run: docker compose ps
      - run: curl -f http://localhost:3000/health || exit 1
      - run: docker compose down
